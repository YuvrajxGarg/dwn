# Builds Dwn for macOS and Windows when a version tag (v1.2.3) is pushed, and
# attaches the apps to that GitHub release. Both apps check the latest release
# for updates:
#   macOS   → Dwn-mac.zip + Dwn-mac.zip.sha256
#   Windows → Dwn-Setup-<version>.exe + .blockmap + latest.yml (electron-updater)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v1.0.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release stays a draft until both apps are attached, so the updater never
      # sees a published release that's missing a platform's download.
      - name: Create the draft release if it doesn't exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Dwn ${TAG#v}" --generate-notes --verify-tag --draft

  mac:
    needs: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - name: Set version
        run: echo "${TAG#v}" > VERSION
      - name: Portable ffmpeg, deno and rclone
        run: |
          mkdir -p tools
          curl -fsSL -o ffmpeg.zip  "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fsSL -o deno.zip    "https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip"
          curl -fsSL -o rclone.zip  "https://downloads.rclone.org/rclone-current-osx-arm64.zip"
          unzip -o ffmpeg.zip -d tools && unzip -o deno.zip -d tools
          unzip -o rclone.zip -d rclone && cp rclone/*/rclone tools/
          chmod +x tools/*
          tools/rclone version | head -1
          tools/ffmpeg -hide_banner -version | head -1
          tools/ffmpeg -hide_banner -encoders | grep -E 'h264_videotoolbox|hevc_videotoolbox|prores_videotoolbox'
          tools/deno --version | head -1
          otool -L tools/ffmpeg | grep -v -E '/usr/lib|/System' || true
      - name: Signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          # A stable signature keeps macOS privacy permissions (Full Disk Access)
          # across updates; ad-hoc signatures change with every build.
          KC="$RUNNER_TEMP/signing.keychain-db"; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ID=$(security find-certificate -c "Dwn Code Signing" -Z "$KC" | awk '/SHA-1/{print $NF}')
          echo "Signing identity: $ID"
          echo "DWN_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
          echo "DWN_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build
        env:
          DWN_GOOGLE_CLIENT_ID: ${{ secrets.DWN_GOOGLE_CLIENT_ID }}
          DWN_GOOGLE_CLIENT_SECRET: ${{ secrets.DWN_GOOGLE_CLIENT_SECRET }}
        run: DWN_TOOLS="$PWD/tools" ./build.sh --release
      - name: Check the signature
        run: |
          # Self-signed, so the requirement reads "certificate root = H<sha1>".
          ID=$(echo "$DWN_SIGN_IDENTITY" | tr 'A-F' 'a-f')
          codesign -dr - dist/Dwn.app 2>&1 | tee /dev/stderr | grep -q "H\"$ID\"" \
            || { echo "Dwn.app is not signed with the Dwn certificate"; exit 1; }
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Dwn-mac.zip dist/Dwn-mac.zip.sha256 --clobber

  windows:
    needs: release
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine
        working-directory: engine
        run: |
          uv venv -q --python 3.12 .venv
          uv pip install -q --python .venv/Scripts/python.exe -r requirements.txt
          .venv/Scripts/pyinstaller.exe --noconfirm --clean --log-level WARN --onedir --name dwn-engine \
            --collect-all yt_dlp --collect-all yt_dlp_ejs --collect-submodules mutagen \
            --distpath build/dist --workpath build/work --specpath build engine.py
      - name: Portable ffmpeg, deno and rclone
        env:
          DWN_GOOGLE_CLIENT_ID: ${{ secrets.DWN_GOOGLE_CLIENT_ID }}
          DWN_GOOGLE_CLIENT_SECRET: ${{ secrets.DWN_GOOGLE_CLIENT_SECRET }}
        run: |
          mkdir -p engine/build/dist/dwn-engine/bin
          curl -fsSL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          curl -fsSL -o deno.zip   "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip"
          curl -fsSL -o rclone.zip "https://downloads.rclone.org/rclone-current-windows-amd64.zip"
          unzip -q ffmpeg.zip -d ffmpeg && unzip -q deno.zip -d deno && unzip -q rclone.zip -d rclone
          cp ffmpeg/*/bin/ffmpeg.exe deno/deno.exe rclone/*/rclone.exe engine/build/dist/dwn-engine/bin/
          engine/build/dist/dwn-engine/bin/rclone.exe version | head -1
          if [ -n "$DWN_GOOGLE_CLIENT_ID" ]; then
            printf '{"drive": {"id": "%s", "secret": "%s"}}\n' "$DWN_GOOGLE_CLIENT_ID" "$DWN_GOOGLE_CLIENT_SECRET" \
              > engine/build/dist/dwn-engine/cloud_clients.json
          fi
          engine/build/dist/dwn-engine/bin/ffmpeg.exe -hide_banner -version | head -1
      - name: Smoke-test the engine
        run: |
          DWN_TOKEN=t DWN_PORT=8765 DWN_WATCH_STDIN=0 engine/build/dist/dwn-engine/dwn-engine.exe > engine.out 2> engine.err &
          for i in $(seq 1 30); do sleep 1; grep -q READY engine.out && break; done
          cat engine.out
          curl -fsS -H 'X-Dwn-Token: t' http://127.0.0.1:8765/health
          curl -fsS -H 'X-Dwn-Token: t' http://127.0.0.1:8765/cloud/status | grep -q '"available": true'
          taskkill //F //IM dwn-engine.exe || true
      - name: Build the installer
        working-directory: windows
        run: |
          npm ci --no-audit --no-fund
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          npx electron-builder --win nsis --x64 --publish never
          ls release
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd windows/release
          gh release upload "$TAG" Dwn-Setup-*.exe Dwn-Setup-*.exe.blockmap latest.yml --clobber

  publish:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish once both apps are attached
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          for a in Dwn-mac.zip Dwn-mac.zip.sha256 latest.yml; do
            echo "$assets" | grep -qx "$a" || { echo "missing $a, leaving the release as a draft"; exit 1; }
          done
          echo "$assets" | grep -qE '^Dwn-Setup-.*\.exe$' || { echo "missing the Windows installer, leaving the release as a draft"; exit 1; }
          gh release edit "$TAG" --draft=false --latest
