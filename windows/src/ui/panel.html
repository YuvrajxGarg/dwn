<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Dwn quick download</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent; }
    #panel { margin: 0; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: rgba(16,16,18,.97);
      border: 1px solid rgba(255,255,255,.10); border-radius: 18px; overflow: hidden; }
    .head { display: flex; align-items: center; gap: 2px; height: 26px; -webkit-app-region: drag; }
    .head button { -webkit-app-region: no-drag; }
    .field { height: 36px; }
    .prev { display: flex; gap: 10px; align-items: center; padding: 0 2px; }
    .prev .meta { flex: 1; min-width: 0; }
    .prev .t { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .prev .s { color: var(--text3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acts { display: flex; gap: 6px; }
    .acts .btn-primary { height: 38px; }
    .acts .btn-icon { width: 38px; height: 38px; background: var(--fill); }
    .active { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid rgba(255,255,255,.07); padding-top: 10px; }
    .aj { display: flex; align-items: center; gap: 10px; }
    .aj .m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .aj .r { display: flex; gap: 6px; font-size: 11.5px; }
    .aj .r b { flex: 1; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aj .r span { color: var(--text3); font-size: 10.5px; }
    .ok { color: var(--text); font-weight: 500; display: flex; gap: 8px; align-items: center; padding: 0 2px; }
    .ok .i { color: var(--accent); }
  </style>
</head>
<body>
  <div id="panel"></div>
  <script src="common.js"></script>
  <script src="panel.js"></script>
</body>
</html>
